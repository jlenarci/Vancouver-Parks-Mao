<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vancouver's Urban Parks</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  #map {
    position: absolute;
    inset: 0;
  }

  #map-info {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(255, 255, 255, 0.95);
    padding: 16px 20px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    max-width: 270px;
  }

  #map-info h1 {
    font-size: 19px;
    margin: 0 0 7px;
    color: #333333;
  }

  #map-info p {
    font-size: 12px;
    line-height: 1.5;
    color: #666666;
    margin: 0 0 10px;
  }

  .park-symbol {
    display: inline-block;
    width: 12px;
    height: 12px;
    background: #438C6A;
    margin-right: 7px;
  }

  .map-credit {
    font-size: 10px;
    color: #777777;
    margin-top: 10px;
  }
  
</style>
</head>
<body>
  <div id="map"></div>

  <div id="map-info">
    <h1>Vancouver's Urban Parks</h1>
    <p>Locating parks across the city.</p>

    <p>
      <span class="park-symbol"></span>
      City parks
    </p>

    <div class="map-credit">
      Data: City of Vancouver
    </div>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'ExploratoryLab1.json',        // the file you downloaded from Maputnik
      center: [-123.12, 49.25],    // longitude, latitude
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
